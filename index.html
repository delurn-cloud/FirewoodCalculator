<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#333333">
<meta name="description" content="Simple firewood cord calculator">
<link rel="manifest" href="manifest.json">
<title>Firewood Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#f4f1eb;color:#222;-webkit-tap-highlight-color:transparent}
.app{max-width:500px;margin:0 auto}
h1{text-align:center;margin:6px 0 4px;font-size:30px}
.subtitle{text-align:center;margin:0 0 20px;color:#555;font-size:16px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
label{display:block;font-size:20px;font-weight:bold;margin-bottom:7px}
.measure{display:flex;gap:8px;margin-bottom:16px}
input,select{min-width:0;padding:14px 10px;font-size:21px;border:2px solid #bbb;border-radius:10px;background:#fff}
input{flex:1}select{width:112px}
input:focus,select:focus{border-color:#555;outline:none}
button{width:100%;border:0;border-radius:12px;padding:16px;font-size:23px;font-weight:bold;margin-top:4px;cursor:pointer}
#calculate{background:#333;color:#fff}
#clear{background:#ddd;color:#222;margin-top:10px}
.result{text-align:center}.result .big{font-size:42px;font-weight:bold;margin:8px 0}.result .secondary{font-size:21px;color:#555}
.note{text-align:center;font-size:14px;color:#666;line-height:1.4}
</style>
</head>
<body>
<div class="app">
<h1>🔥 Firewood Calculator</h1>
<p class="subtitle">Measure your woodpile</p>
<div class="card">
<label for="lengthInput">Length</label>
<div class="measure"><input id="lengthInput" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><select id="lengthUnit"><option value="ft">feet</option><option value="in">inches</option></select></div>

<label for="heightInput">Height</label>
<div class="measure"><input id="heightInput" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><select id="heightUnit"><option value="ft">feet</option><option value="in">inches</option></select></div>

<label for="depthInput">Depth</label>
<div class="measure"><input id="depthInput" type="number" inputmode="decimal" min="0" step="any" placeholder="0"><select id="depthUnit"><option value="ft">feet</option><option value="in">inches</option></select></div>

<button id="calculateButton" type="button">CALCULATE</button>
<button id="clearButton" type="button">CLEAR</button>
</div>

<div class="card result" id="resultCard" style="display:none">
<div class="secondary">Your woodpile contains approximately</div>
<div class="big" id="cordsResult">0.00 cords</div>
<div class="secondary" id="cubicFeetResult">0 cubic feet</div>
</div>

<div class="note">One full cord = 128 cubic feet.<br>This calculator measures the volume of the stacked wood.</div>
</div>

<script>
(function () {
    const lengthInput = document.getElementById("lengthInput");
    const heightInput = document.getElementById("heightInput");
    const depthInput = document.getElementById("depthInput");

    const lengthUnit = document.getElementById("lengthUnit");
    const heightUnit = document.getElementById("heightUnit");
    const depthUnit = document.getElementById("depthUnit");

    const resultCard = document.getElementById("resultCard");
    const cordsResult = document.getElementById("cordsResult");
    const cubicFeetResult = document.getElementById("cubicFeetResult");

    function toFeet(value, unit) {
        return unit === "in" ? value / 12 : value;
    }

    function calculate() {
        const length = parseFloat(lengthInput.value);
        const height = parseFloat(heightInput.value);
        const depth = parseFloat(depthInput.value);

        if (![length, height, depth].every(function (v) {
            return Number.isFinite(v) && v > 0;
        })) {
            alert("Please enter all three measurements.");
            return;
        }

        const L = toFeet(length, lengthUnit.value);
        const H = toFeet(height, heightUnit.value);
        const D = toFeet(depth, depthUnit.value);

        const cubicFeet = L * H * D;
        const cords = cubicFeet / 128;

        cordsResult.textContent =
            cords.toFixed(2) + (cords === 1 ? " cord" : " cords");

        cubicFeetResult.textContent = cubicFeet.toFixed(1) + " cubic feet";
        resultCard.style.display = "block";
    }

    function clearAll() {
        lengthInput.value = "";
        heightInput.value = "";
        depthInput.value = "";

        resultCard.style.display = "none";

        lengthInput.focus();
    }

    document.getElementById("calculateButton").addEventListener("click", calculate);
    document.getElementById("clearButton").addEventListener("click", clearAll);
})();
</script>
</body>
</html>
